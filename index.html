<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F2EFE8">
    <meta name="description" content="Portfólio de Pedro Souza, desenvolvedor Full Stack com foco em front-end.">
    <title>Pedro Souza — Full Stack Developer</title>
    <script>
      document.documentElement.classList.add('js');
      var navigationEntry = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      var isReload = navigationEntry ? navigationEntry.type === 'reload' : performance.navigation && performance.navigation.type === 1;
      if (isReload) {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        if (location.hash) history.replaceState(null, '', location.pathname + location.search);
        addEventListener('load', function () {
          requestAnimationFrame(function () { scrollTo(0, 0); });
        }, { once: true });
      }
      var introSeen = false;
      try {
        introSeen = sessionStorage.getItem('intro-seen') === '1';
      } catch (_) {}
      if (!introSeen) {
        try { sessionStorage.setItem('intro-seen', '1'); } catch (_) {}
        document.documentElement.classList.add('intro-playing');
        window.introWatchdog = setTimeout(function () {
          document.documentElement.classList.remove('intro-playing', 'intro-running');
          var page = document.querySelector('.page');
          if (page) page.inert = false;
        }, 8000);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
